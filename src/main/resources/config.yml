discord:
  # Токен вашего Discord бота (получить на https://discord.com/developers/applications)
  token: "YOUR_BOT_TOKEN_HERE"

  # ID роли, которая может использовать /log
  # Чтобы получить ID роли: Discord → Настройки сервера → Роли → ПКМ по роли → Копировать ID
  # (нужно включить режим разработчика: Настройки → Расширенные → Режим разработчика)
  allowed-role-id: "123456789012345678"

  # ID сервера — нужен для регистрации slash-команд
  # ПКМ по иконке сервера → Копировать ID
  guild-id: "123456789012345678"
